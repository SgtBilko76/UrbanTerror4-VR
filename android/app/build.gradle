apply plugin: 'com.android.application'

// The engine and the game modules are cross-compiled by the root Makefile, not by Gradle. These
// paths tie the two halves of the build together.
def repoRoot = file('../..')
def engineSrc = file('src/main/cpp/code')
// Gradle stages the Makefile output here and packages it from here. It deliberately does NOT use
// src/main/jniLibs: CMake used to copy into that folder during externalNativeBuild, after Gradle
// had already fingerprinted it, so the merge task would report UP-TO-DATE and ship the previous
// build's libraries.
def jniStageDir = file("${buildDir}/jniStage")

// A Unix shell is needed for the Makefile, which uses $(shell ...) in many places.
def gitBash = ['C:/Program Files/Git/bin/bash.exe', '/bin/bash', '/usr/bin/bash']
        .collect { new File(it) }.find { it.exists() }

android {
	namespace 'com.drbeef.ioq3quest'
	compileSdk 34
	ndkVersion "25.1.8937393"
	defaultConfig {
		applicationId = 'com.bilko.urtquest'
		minSdkVersion 25
		targetSdkVersion 34
		versionCode 100
		versionName "1.0.0"
		externalNativeBuild {
			cmake {
				arguments '-DANDROID_STL=c++_static', "-DJNI_STAGE_DIR=${jniStageDir}"
			}
		}
		ndk {
			abiFilters 'arm64-v8a'
		}
	}

	signingConfigs {
		// Release signs with your key when the properties are supplied (-Pkey.store=... or in
		// ~/.gradle/gradle.properties), and falls back to the debug keystore so that Build and Run
		// from Studio always produces something installable.
		release {
			def storePath = project.findProperty('key.store')
			if (storePath) {
				storeFile file(storePath)
				storePassword project.findProperty('key.store.password')
				keyAlias project.findProperty('key.alias')
				keyPassword project.findProperty('key.alias.password')
			} else {
				storeFile file("${System.properties['user.home']}/.android/debug.keystore")
				storePassword 'android'
				keyAlias 'androiddebugkey'
				keyPassword 'android'
			}
		}
	}

	buildTypes {
		release {
			minifyEnabled false
			proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
			signingConfig signingConfigs.release
		}
	}
	externalNativeBuild {
		cmake {
			path 'src/main/cpp/CMakeLists.txt'
			version '3.22.1'
		}
	}
	sourceSets {
		main {
			// Assigned, not appended: the default src/main/jniLibs must not also be picked up, or
			// the old copies left there by the previous build flow collide with the staged ones.
			jniLibs.srcDirs = [jniStageDir]
		}
	}
	compileOptions {
		sourceCompatibility JavaVersion.VERSION_1_8
		targetCompatibility JavaVersion.VERSION_1_8
	}

	lint {
		// A lint warning must not fail an otherwise good release build of a sideloaded app.
		checkReleaseBuilds false
	}
}

dependencies {
	implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
	implementation 'androidx.appcompat:appcompat:1.0.2'
	implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
}

// ---------------------------------------------------------------------------------------------
// Stage 1 and the generated assets. run.bat / run.sh do these steps too, so either entry point
// produces the same APK.
// ---------------------------------------------------------------------------------------------

// Written from versionName so the in-game version string cannot drift from the manifest.
tasks.register('generateVrVersionHeader') {
	def header = new File(engineSrc, 'vr/vr_version.h')
	def version = android.defaultConfig.versionName
	outputs.file(header)
	inputs.property('version', version)
	doLast {
		header.parentFile.mkdirs()
		header.text = "#define Q3QVERSION  \"${version}\"\n"
	}
}

// The VR shaders, menus and gfx overrides. r_externalGLSL defaults to 1, so the shaders in this
// pk3 are the ones actually used at runtime -- if it is stale or missing the engine silently runs
// on old shaders. Built with Gradle's Zip task because `zip` is not always on PATH on Windows.
tasks.register('packPakQ3Q', Zip) {
	from file('src/main/pakQ3Q')
	// UrT: VR GLSL shaders, the VR HUD shader script and its gfx. Q3's VR menus (ui/)
	// would replace UrT's own UI, so they are left out.
	include 'glsl/**', 'scripts/**', 'gfx/**'
	archiveFileName = 'pakQ3Q.pk3'
	destinationDirectory = file('src/main/assets')
}

android.applicationVariants.all { variant ->
	def name = variant.name.capitalize()
	// The Makefile and CMakeLists both key off these names.
	def makeTarget = variant.buildType.name == 'debug' ? 'debug' : 'release'
	def makeOutDir = new File(repoRoot, "build/${makeTarget}-android-aarch64")

	def buildEngine = tasks.register("buildEngine${name}", Exec) {
		workingDir repoRoot
		description = "Cross-compiles the ioq3quest engine and game modules (make ${makeTarget})"
		def jobs = Runtime.runtime.availableProcessors()
		def make = "${android.sdkDirectory}/ndk/${android.ndkVersion}/prebuilt/windows-x86_64/bin/make.exe"
		if (gitBash && file(make).exists()) {
			commandLine gitBash.absolutePath, '-c', "'${make}' -j ${jobs} ${makeTarget}"
		} else if (gitBash) {
			commandLine gitBash.absolutePath, '-c', "make -j ${jobs} ${makeTarget}"
		} else {
			commandLine 'make', "-j${jobs}", makeTarget
		}
		// -PskipEngineBuild=true leaves the existing Makefile output alone.
		enabled = !project.hasProperty('skipEngineBuild')
	}

	def stageJniLibs = tasks.register("stageJniLibs${name}", Copy) {
		dependsOn buildEngine
		into new File(jniStageDir, 'arm64-v8a')
		from(makeOutDir) {
			include 'libioquake3_opengl2.so', 'libSDL2.so', 'libopenxr_loader.so'
		}
		// The game modules ship one copy per mod, renamed so both can be loaded.
		['baseq3', 'missionpack'].each { mod ->
			['cgame', 'qagame', 'ui'].each { module ->
				from(new File(makeOutDir, mod)) {
					include "${module}aarch64.so"
					rename '(.*)\\.so', "lib\$1_${mod}.so"
				}
			}
		}
	}

	// libmain.so links against the staged engine libraries, so staging has to come first.
	// preBuild is the dependable anchor: it runs before the native build whatever AGP calls the
	// CMake tasks. They are matched by prefix as well, since AGP names them after the CMake build
	// type (Debug / RelWithDebInfo) rather than the variant.
	def cmakePrefix = variant.buildType.name == 'debug' ? 'CMakeDebug' : 'CMakeRelWithDebInfo'
	tasks.matching {
		it.name.startsWith("configure${cmakePrefix}") || it.name.startsWith("build${cmakePrefix}")
	}.configureEach {
		dependsOn stageJniLibs
	}
	tasks.matching { it.name ==~ /merge${name}(JniLibFolders|NativeLibs)/ }.configureEach {
		dependsOn stageJniLibs
	}
	tasks.matching { it.name == "merge${name}Assets" }.configureEach {
		dependsOn tasks.named('packPakQ3Q')
	}
	// The pk3 lands in src/main/assets, which lint also scans, so Gradle 8 requires every
	// consumer of that directory to declare the dependency, not just the asset merge.
	tasks.matching { it.name.startsWith('lint') }.configureEach {
		dependsOn tasks.named('packPakQ3Q')
	}
	variant.preBuildProvider.configure {
		dependsOn tasks.named('generateVrVersionHeader'), stageJniLibs
	}
}
