// UrbanTerror4-VR: settings applied on every start. Copied once; your own edits are kept.

// Quest/PICO have no keyboard: a preset player name skips the first-run name screen.
// Change it here (or in the game's Setup > Player menu).
seta name "QuestPlayer"
seta ui_Name "QuestPlayer"

// The VR crosshair sits where the laser points; UrT's own flat crosshair is switched off.
seta cg_drawCrosshair "0"
// The 3D view always fills the headset view.
seta cg_viewsize "100"

